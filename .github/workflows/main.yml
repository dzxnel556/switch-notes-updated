name: Build Switch Notes
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      # Files are uploaded flat, so put them where the Makefiles expect them
      - name: Arrange files
        run: |
          mkdir -p source overlay/source
          mv main.cpp source/main.cpp
          mv overlay-main.cpp overlay/source/main.cpp
          mv overlay-Makefile overlay/Makefile

      - name: Install libraries
        run: dkp-pacman -S --noconfirm --needed switch-dev switch-pkg-config switch-sdl2 switch-sdl2_ttf

      - name: Get libtesla
        run: |
          command -v git >/dev/null || (apt-get update && apt-get install -y git)
          git clone --depth 1 https://github.com/WerWolv/libtesla overlay/libtesla

      - name: Build app
        run: make

      - name: Build overlay
        run: make -C overlay

      - uses: actions/upload-artifact@v4
        with:
          name: switch-notes
          path: |
            switch-notes.nro
            overlay/notes-overlay.ovl
